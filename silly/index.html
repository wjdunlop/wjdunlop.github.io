<!doctype html>
<!--
  StatiCrypt password page for the published game, styled as a Windows XP "Log On" dialog to
  match it. Pass it to StatiCrypt with -t. The name markers are filled in by StatiCrypt.
-->
<html lang="en" class="staticrypt-html">
  <head>
    <meta charset="utf-8" />
    <title>Silly Biscuits</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="cache-control" content="max-age=0" />
    <meta http-equiv="cache-control" content="no-cache" />
    <meta http-equiv="expires" content="0" />
    <meta http-equiv="pragma" content="no-cache" />
    <style>
      :root {
        --xp-frame: #0831d9;
        --xp-face: #ece9d8;
        --xp-face-dark: #aca899;
        --felt: #008000;
        --felt-dark: #006400;
        --card-red: #e00000;
        --ui-font: Tahoma, 'Segoe UI', Verdana, sans-serif;
        color-scheme: light;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
        margin: 0;
      }

      body {
        font: 11px/1.4 var(--ui-font);
        color: #000;
        background:
          radial-gradient(ellipse 70% 40% at 25% 105%, #5a9e2e 0 60%, transparent 61%),
          radial-gradient(ellipse 80% 45% at 85% 110%, #4a8f22 0 60%, transparent 61%),
          radial-gradient(ellipse 40% 12% at 70% 22%, rgba(255, 255, 255, 0.55), transparent 70%),
          radial-gradient(ellipse 30% 9% at 22% 14%, rgba(255, 255, 255, 0.45), transparent 70%),
          linear-gradient(#245edb 0%, #5d93e6 45%, #a9cdf3 75%, #c8e2f8 100%);
        background-attachment: fixed;
      }

      .hidden {
        display: none !important;
      }

      .desktop {
        min-height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px 16px;
      }

      .loading {
        color: #fff;
        font-size: 13px;
        text-shadow: 1px 1px 0 rgba(0, 0, 0, 0.5);
      }

      /* ---------- window ---------- */

      .window {
        position: relative;
        width: min(100%, 380px);
        background: var(--xp-face);
        border: 3px solid var(--xp-frame);
        border-top: 0;
        border-radius: 8px 8px 0 0;
        box-shadow: 2px 4px 14px rgba(0, 0, 0, 0.45);
      }

      .titlebar {
        display: flex;
        align-items: center;
        gap: 5px;
        height: 30px;
        margin: 0 -3px;
        padding: 0 5px 0 8px;
        border-radius: 8px 8px 0 0;
        color: #fff;
        font: bold 13px 'Trebuchet MS', var(--ui-font);
        text-shadow: 1px 1px #0f1089;
        background: linear-gradient(
          #0997ff 0%,
          #0053ee 8%,
          #0050ee 40%,
          #0066ff 88%,
          #0066ff 93%,
          #005bff 95%,
          #003dd7 96%,
          #003dd7 100%
        );
        user-select: none;
      }

      .titlebar__title {
        flex: 1;
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
      }

      .titlebar__icon {
        position: relative;
        width: 16px;
        height: 16px;
        flex: none;
      }

      .titlebar__icon i {
        position: absolute;
        left: 1px;
        top: 1px;
        width: 9px;
        height: 12px;
        border: 1px solid #000;
        border-radius: 1px;
        background:
          radial-gradient(ellipse 30% 26% at 50% 45%, #f2be3d 0 70%, transparent 75%),
          linear-gradient(#e9b640 0 2px, #c8161b 2px calc(100% - 2px), #e9b640 calc(100% - 2px));
      }

      .titlebar__icon i + i {
        left: 6px;
        top: 3px;
        background: #fff;
      }

      .titlebar__icon i + i::after {
        content: '♥';
        position: absolute;
        inset: -2px 0 0;
        color: var(--card-red);
        font-style: normal;
        font-size: 8px;
        text-align: center;
        text-shadow: none;
      }

      .titlebar__buttons {
        display: flex;
        gap: 2px;
      }

      .xp-button {
        position: relative;
        width: 21px;
        height: 21px;
        border: 1px solid #fff;
        border-radius: 3px;
        background: radial-gradient(circle at 90% 90%, #0054e9 0%, #2263d5 55%, #4482f0 70%, #a3bbec 90%, #fff 100%);
        box-shadow: inset -1px -1px 1px rgba(0, 0, 0, 0.2);
      }

      .xp-button--help::after {
        content: '?';
        position: absolute;
        inset: 0;
        color: #fff;
        font: bold 13px/19px var(--ui-font);
        text-align: center;
        text-shadow: none;
      }

      .xp-button--close {
        background: radial-gradient(circle at 90% 90%, #cc4600 0%, #dc6527 55%, #cd7546 70%, #ffccb2 90%, #fff 100%);
      }

      .xp-button--close::before,
      .xp-button--close::after {
        content: '';
        position: absolute;
        left: 9px;
        top: 3px;
        width: 2px;
        height: 13px;
        background: #fff;
        transform: rotate(45deg);
      }

      .xp-button--close::after {
        transform: rotate(-45deg);
      }

      /* ---------- felt banner with a fan of cards ---------- */

      .banner {
        position: relative;
        display: flex;
        align-items: center;
        gap: 18px;
        height: 112px;
        padding: 0 20px;
        background: var(--felt);
        border-bottom: 1px solid var(--felt-dark);
        overflow: hidden;
      }

      .fan {
        position: relative;
        width: 92px;
        height: 80px;
        flex: none;
      }

      .card {
        position: absolute;
        left: 18px;
        top: 6px;
        width: 50px;
        height: 68px;
        border: 1px solid #000;
        border-radius: 4px;
        background: #fff;
        transform-origin: 50% 110%;
        box-shadow: 1px 1px 2px rgba(0, 0, 0, 0.25);
      }

      .card--back {
        transform: rotate(-22deg);
      }

      /* the same chilli-label back as the game: red, gold bands, a cameo and 饼干 */
      .card--back {
        background: #c8161b;
        overflow: hidden;
      }

      .card--back::before {
        content: '';
        position: absolute;
        inset: 2px;
        border-radius: 2px;
        background:
          linear-gradient(#e9b640, #e9b640) 0 2px / 100% 4px no-repeat,
          linear-gradient(#e9b640, #e9b640) 0 calc(100% - 2px) / 100% 4px no-repeat,
          radial-gradient(ellipse 34% 26% at 50% 40%, #fff1d2 0 62%, #f2be3d 64% 82%, transparent 85%),
          repeating-conic-gradient(from 0deg at 50% 40%, rgba(255, 106, 69, 0.18) 0 10deg, transparent 10deg 20deg),
          #c8161b;
      }

      .card--back::after {
        content: '饼干';
        position: absolute;
        left: 0;
        right: 0;
        bottom: 13px;
        color: #ffd23f;
        font: 900 10px/1 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
        text-align: center;
        -webkit-text-stroke: 1px #6e0a06;
        paint-order: stroke fill;
      }

      .card--one {
        transform: rotate(0deg);
      }

      .card--two {
        transform: rotate(22deg);
        color: var(--card-red);
      }

      .card__corner {
        position: absolute;
        top: 3px;
        left: 4px;
        font: bold 11px/1.05 var(--ui-font);
        text-align: center;
      }

      .card__pip {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        font: 24px Georgia, serif;
      }

      .banner__title {
        color: #fff;
        text-shadow: 1px 1px 0 rgba(0, 0, 0, 0.55);
      }

      .banner__title h1 {
        margin: 0;
        font: bold italic 22px/1.1 'Trebuchet MS', var(--ui-font);
        letter-spacing: 0.3px;
      }

      .banner__title p {
        margin: 2px 0 0;
        font-size: 12px;
        opacity: 0.9;
      }

      /* ---------- form ---------- */

      .body {
        padding: 14px 16px 16px;
      }

      .body p {
        margin: 0 0 12px;
      }

      .field {
        display: grid;
        grid-template-columns: auto 1fr;
        align-items: center;
        gap: 8px;
      }

      .field label {
        white-space: nowrap;
      }

      input[type='password'],
      input[type='text'] {
        width: 100%;
        height: 21px;
        padding: 1px 4px;
        border: 1px solid #7f9db9;
        border-radius: 0;
        background: #fff;
        font: 11px var(--ui-font);
      }

      input[type='password']:focus {
        outline: none;
        border-color: #3c7fb1;
      }

      .remember {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        margin-top: 10px;
        cursor: default;
      }

      .remember input {
        margin: 0;
        width: 13px;
        height: 13px;
        accent-color: #21a121;
      }

      .buttons {
        display: flex;
        justify-content: flex-end;
        gap: 6px;
        margin-top: 14px;
        padding-top: 12px;
        border-top: 1px solid var(--xp-face-dark);
        box-shadow: inset 0 1px #fff;
      }

      .push-button {
        min-width: 75px;
        height: 23px;
        padding: 0 12px;
        border: 1px solid #003c74;
        border-radius: 3px;
        background: linear-gradient(#fff 0%, #ecebe6 86%, #d6d0c5 100%);
        font: 11px var(--ui-font);
        color: #000;
        cursor: default;
      }

      .push-button:hover {
        box-shadow:
          inset 0 -2px #f89b2f,
          inset 0 2px #ffe8a3;
      }

      .push-button:focus-visible {
        outline: 1px dotted #000;
        outline-offset: -4px;
      }

      .push-button:active {
        background: linear-gradient(#e5e4de, #f2f1ec);
      }

      .error {
        min-height: 15px;
        margin-top: 8px;
        color: #c00000;
      }

      /* a wrong password gets the same rubber stamp as a failed hidden card */
      .wrong {
        position: absolute;
        right: 22px;
        top: 136px;
        font: 900 52px/1 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans SC', sans-serif;
        color: #e00000;
        -webkit-text-stroke: 3px #fff;
        paint-order: stroke fill;
        text-shadow: 3px 3px 0 #000;
        pointer-events: none;
        opacity: 0;
      }

      .wrong--show {
        animation: stamp 1.2s ease-out both;
      }

      @keyframes stamp {
        0% {
          transform: rotate(-30deg) scale(2.6);
          opacity: 0;
        }
        16% {
          transform: rotate(-12deg) scale(0.92);
          opacity: 1;
        }
        26% {
          transform: rotate(-6deg) scale(1.08);
        }
        36%,
        75% {
          transform: rotate(-12deg) scale(1);
          opacity: 1;
        }
        100% {
          transform: rotate(-12deg) scale(1) translateY(-14px);
          opacity: 0;
        }
      }

      .window--shake {
        animation: shake 0.35s linear;
      }

      @keyframes shake {
        20% {
          transform: translateX(-6px);
        }
        40% {
          transform: translateX(6px);
        }
        60% {
          transform: translateX(-4px);
        }
        80% {
          transform: translateX(3px);
        }
      }

      @media (max-width: 420px) {
        .desktop {
          padding: 16px;
        }

        .banner {
          gap: 10px;
          padding: 0 12px;
        }

        .banner__title h1 {
          font-size: 19px;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .wrong--show {
          animation: none;
          opacity: 1;
          transform: rotate(-12deg);
        }

        .window--shake {
          animation: none;
        }
      }
    </style>
  </head>

  <body class="staticrypt-body">

      <span class="loading">Loading…</span>
    </div>

    <div id="staticrypt_content" class="desktop hidden">
      <div class="window" id="window" role="dialog" aria-labelledby="dialog-title">
        <div class="titlebar">
          <span class="titlebar__icon" aria-hidden="true"><i></i><i></i></span>
          <span class="titlebar__title" id="dialog-title">Log On to Silly Biscuits</span>
          <span class="titlebar__buttons" aria-hidden="true">
            <span class="xp-button xp-button--help"></span>
            <span class="xp-button xp-button--close"></span>
          </span>
        </div>

        <div class="banner" aria-hidden="true">
          <div class="fan">
            <div class="card card--back"></div>
            <div class="card card--one">
              <span class="card__corner">A<br />♠</span><span class="card__pip">♠</span>
            </div>
            <div class="card card--two">
              <span class="card__corner">10<br />♥</span><span class="card__pip">♥</span>
            </div>
          </div>
          <div class="banner__title">
            <h1>Silly Biscuits</h1>
            <p lang="zh">饼干 · a card game</p>
          </div>
        </div>

        <form id="staticrypt-form" class="body" action="#" method="post">
          <p>Type the password to play.</p>

          <div class="field">
            <label for="staticrypt-password"><u>P</u>assword:</label>
            <input id="staticrypt-password" type="password" name="password" aria-label="Password" autocomplete="current-password" autofocus />
          </div>

          <label id="staticrypt-remember-label" class="remember hidden">
            <input id="staticrypt-remember" type="checkbox" name="remember" />
            Remember me on this computer
          </label>

          <div class="error" id="error" role="alert"></div>

          <div class="buttons">
            <button type="submit" class="push-button">Play</button>
          </div>
        </form>

        <span class="wrong" id="wrong" lang="zh" aria-hidden="true">错！</span>
      </div>
    </div>
